name: Monitor VPN Servers

on:
  schedule:
    - cron: "*/5 * * * *"   # كل 5 دقائق
  workflow_dispatch:          # تشغيل يدوي

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4        # أقل من 5 دقائق عشان ما يتداخل مع الـ run التالي

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # نجلب آخر نسخة دائماً (مهم — لو collect.py حدّث servers.json قريباً)
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install aiohttp

      - name: Run monitor
        run: python monitor.py

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add servers.json
          # لو ما في تغيير → ما نعمل commit (يوفر تاريخ نظيف)
          if git diff --cached --quiet; then
            echo "✅ لا تغيير — كل السيرفرات أحياء"
          else
            git pull --rebase origin main
            git commit -m "🔄 monitor: replace dead servers $(date -u +'%H:%M UTC')"
            git push
          fi
