name: Collect VPN Servers

on:
  schedule:
    - cron: "0 */6 * * *"   # كل 6 ساعات
  workflow_dispatch:          # تشغيل يدوي من GitHub

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write   # لرفع servers.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install aiohttp

      - name: Run collector
        run: python collect.py

      - name: Commit & push servers.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add servers.json
          git diff --cached --quiet || git commit -m "🔄 update servers $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
